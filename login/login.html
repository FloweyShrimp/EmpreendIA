<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | EmpreendIA</title>

  <link rel="stylesheet" href="login.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

  <div class="background-glow"></div>

  <div class="container">

    <div class="left">

      <a href="../index.html">
        <img src="../images/logo.png" class="logo">
      </a>

      <h1>Bem-vindo de volta.</h1>

      <p>Entre na sua conta e continue evoluindo seu negócio com inteligência artificial.</p>

      <img src="../images/mascote.png" class="mascot">

    </div>

    <div class="right">

      <div class="card">

        <h2>Fazer login</h2>

        <form id="loginForm">

          <input type="email" id="emailLogin" placeholder="Seu email" required>

          <input type="password" id="senhaLogin" placeholder="Sua senha" required>

          <div class="options">
            <label>
              <input type="checkbox">
              Lembrar de mim
            </label>
            <a href="#">Esqueci minha senha</a>
          </div>

          <button type="submit" class="login-btn">Entrar</button>

        </form>

        <div class="divider">
          <span>ou continue com</span>
        </div>

        <div class="social-buttons">

          <button class="social google" id="googleLogin">Google</button>

          <button class="social facebook">Facebook</button>

          <button class="social apple">Apple</button>

        </div>

        <p class="register-text">
          Não possui conta?
          <a href="../cadastro/cadastro.html">Criar conta</a>
        </p>

      </div>

    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../.@firebase.js"></script>
  <script src="login.js"></script>

</body>

</html>
