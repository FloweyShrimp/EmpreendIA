<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro | EmpreendIA</title>

  <link rel="stylesheet" href="cadastro.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

  <div class="background-glow"></div>

  <div class="container">

    <div class="left">

      <a href="index.html">
        <img src="logo.png" class="logo">
      </a>

      <h1>Crie sua conta na EmpreendIA</h1>

      <p>Receba estratégias inteligentes para crescer seu negócio.</p>

      <img src="mascote.png" class="mascot">

    </div>

    <div class="right">

      <div class="card">

        <h2>Cadastro</h2>

        <form id="cadastroForm">

          <input type="text" id="nome" placeholder="Seu nome">

          <input type="email" id="emailCadastro" placeholder="Seu email">

          <input type="password" id="senhaCadastro" placeholder="Sua senha">

          <button type="submit">Criar conta</button>

        </form>

        <div class="divider">
          <span>ou continue com</span>
        </div>

        <div class="social-buttons">

          <button class="social google" id="googleCadastro">Google</button>

          <button class="social facebook">Facebook</button>

          <button class="social apple">Apple</button>

        </div>

        <p class="login-text">
          Já possui conta?
          <a href="login.html">Fazer login</a>
        </p>

      </div>

    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="cadastro.js"></script>

</body>
</html>
